<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<title>我的工作台 · V4</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--text:#262522;--muted:#88847d;--line:#ebe7df;--accent:#6f7f68;--soft:#eef2eb;--warn:#b9823d;--danger:#b45f5f;--blue:#667b92}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:20px 15px 100px}
.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}
.date{color:var(--muted);font-size:13px}
.title{font-size:29px;font-weight:800;margin-top:4px}
.muted{color:var(--muted);font-size:13px}
nav{position:sticky;top:0;z-index:10;background:#f7f5f0ee;backdrop-filter:blur(12px);padding:8px 0;margin-bottom:8px;overflow:auto;display:flex;gap:7px}
nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;color:#555}
nav button.active{background:#282722;color:#fff;border-color:#282722}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:11px 0;box-shadow:0 4px 18px #00000005}
.card h2{font-size:17px;margin:0 0 13px}
.hero{background:#e9eee7}
.hero .big{font-size:34px;font-weight:850}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.money{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{background:#faf9f6;border-radius:16px;padding:12px}
.metric small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.metric strong{font-size:20px}
.bar,.goalbar{height:8px;background:#e8e5de;border-radius:99px;overflow:hidden;margin:10px 0}
.bar i,.goalbar i{display:block;height:100%;background:var(--accent);width:0}
.btn{border:0;border-radius:13px;padding:10px 13px;background:#282722;color:white;font-size:14px;font-weight:650}
.btn.secondary{background:#f0eee9;color:#333}
.btn.danger{background:#f6e8e8;color:var(--danger)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-size:15px;outline:none;font-family:inherit}
textarea{min-height:80px;resize:vertical}
.form{display:grid;gap:9px}
.form label{font-size:13px;color:#555}
.form label input,.form label select,.form label textarea{margin-top:5px}
.task,.event,.food,.expense{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child,.event:last-child,.food:last-child,.expense:last-child{border-bottom:0}
.task input{width:20px;height:20px}
.done{text-decoration:line-through;color:var(--muted)}
.priority{font-size:11px;padding:4px 7px;border-radius:999px;background:#f0eee9}
.priority.high{background:#f6e8e8;color:var(--danger)}
.priority.mid{background:#f5efe4;color:var(--warn)}
.section{scroll-margin-top:55px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.small{font-size:12px}
.tag{display:inline-block;padding:5px 8px;background:var(--soft);border-radius:9px;font-size:11px;color:#5f6f59}
.note{font-size:14px;line-height:1.65}
.status{margin-top:10px;padding:11px 12px;border-radius:13px;background:#f3f1ec;font-size:13px;line-height:1.55}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.footer{color:var(--muted);font-size:11px;text-align:center;margin-top:25px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}
.tabs button{border:1px solid var(--line);background:#faf9f6;border-radius:10px;padding:8px 10px;font-size:12px}
.tabs button.sel{background:#e9eee7;border-color:#dce5d8}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:end;justify-content:center;padding:10px;z-index:20}
.sheet{background:white;width:min(760px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:20px}
.sheet h3{margin:0 0 15px}
.close{float:right;border:0;background:#f1eee8;border-radius:50%;width:32px;height:32px}
.calendar{margin-top:4px}
.week,.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week b{text-align:center;color:var(--muted);font-size:11px;padding:5px}
.calday{min-height:64px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px;text-align:left;position:relative;color:var(--text)}
.calday.today{background:var(--soft);border-color:#d5dfd0}
.calday.blank{border:0;background:transparent}
.calday span{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.calday i{font-style:normal;font-size:11px;color:var(--accent)}
.calday em{position:absolute;right:6px;bottom:5px;font-style:normal;font-size:10px;color:var(--danger)}
@media(max-width:430px){
 main{padding-left:12px;padding-right:12px}
 .title{font-size:26px}
 .card{padding:16px}
 .grid2{grid-template-columns:1fr}
 .hero .big{font-size:31px}
}
</style>
</head>

<body>
<main>

<div class="top">
  <div>
    <div class="date" id="date"></div>
    <div class="title">我的工作台</div>
  </div>
  <div class="muted" id="dayleft"></div>
</div>

<nav id="nav">
  <button class="active" onclick="jump('home')">HOME</button>
  <button onclick="jump('money')">MONEY</button>
  <button onclick="jump('calendar')">CALENDAR</button>
  <button onclick="jump('tasks')">TASKS</button>
  <button onclick="jump('food')">FOOD</button>
</nav>

<section class="card hero section" id="home">
  <div class="row">
    <h2>🏠 今天</h2>
    <span id="health">—</span>
  </div>
  <div class="big" id="daily">¥0.00</div>
  <div class="muted" id="moneyTip"></div>
  <div class="status" id="todayBrief"></div>
</section>

<section class="card section" id="money">
  <div class="row">
    <h2>💰 MONEY</h2>
    <div class="actions">
      <button class="btn secondary" onclick="openMoney()">设置</button>
      <button class="btn" onclick="openRecord()">＋ 记一笔</button>
    </div>
  </div>

  <div class="money">
    <div class="metric">
      <small>本周期生活费</small>
      <strong id="allowance">¥0</strong>
    </div>

    <div class="metric">
      <small>存钱目标</small>
      <strong id="target">¥0</strong>
    </div>

    <div class="metric">
      <small>本周期净支出</small>
      <strong id="spent">¥0</strong>
    </div>

    <div class="metric">
      <small>周期剩余可花</small>
      <strong id="remain">¥0</strong>
    </div>
  </div>

  <div class="bar">
    <i id="moneybar"></i>
  </div>

  <div class="muted" id="budgetPeriod" style="margin-top:9px"></div>

  <div class="row muted">
    <span id="saveProgress"></span>
    <span id="forecast"></span>
  </div>

  <div class="status" id="moneyAdvice"></div>
  <div id="expenseList"></div>
</section>

<section class="card section" id="calendar">
  <div class="row">
    <h2>📅 CALENDAR</h2>
    <button class="btn secondary" onclick="addEvent()">＋ 添加</button>
  </div>

  <div class="tabs" id="calTabs"></div>
  <div id="events"></div>
</section>

<section class="card section" id="tasks">
  <div class="row">
    <h2>✅ TASKS</h2>
    <button class="btn secondary" onclick="addTask()">＋ 添加</button>
  </div>

  <div class="tabs">
    <button class="sel" id="taskAll" onclick="taskFilter='all';render()">全部</button>
    <button id="taskOpen" onclick="taskFilter='open';render()">未完成</button>
    <button id="taskDone" onclick="taskFilter='done';render()">已完成</button>
  </div>

  <div id="tasksList"></div>
</section>

<section class="card section" id="food">
  <div class="row">
    <h2>🍱 FOOD</h2>
    <button class="btn secondary" onclick="addFood()">＋ 添加</button>
  </div>

  <div class="status" id="foodAdvice"></div>
  <div id="foodList"></div>
</section>

<div class="footer">
  V4 · 数据保存在本机浏览器中
</div>

</main>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="close" onclick="closeModal()">×</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>

const KEY="my_dashboard_v3";
const OLD="my_dashboard_v2";
const LEGACY="my_dashboard_v1";

let old=JSON.parse(
  localStorage.getItem(OLD)||
  localStorage.getItem(LEGACY)||
  "null"
);

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  allowance:old?.allowance??2000,
  target:old?.target??500,
  fixed:old?.fixed??300,

  budgetStart:old?.budgetStart||(()=>{
    let d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`
  })(),

  budgetEnd:old?.budgetEnd||(()=>{
    let d=new Date();
    let last=new Date(
      d.getFullYear(),
      d.getMonth()+1,
      0
    ).getDate();

    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(last).padStart(2,"0")}`
  })(),

  records:(old?.records||old?.expenses||[]).map(x=>({
    ...x,
    type:x.type||"expense"
  })),

  tasks:(old?.tasks||[]).map((x,i)=>({
    id:x.id||Date.now()+i,
    t:x.t||"",
    done:!!x.done,
    priority:x.priority||"mid",
    deadline:x.deadline||"",
    source:x.source||""
  })),

  events:old?.events||[],
  foods:old?.foods||[]
};


/* V3 → V4
   只补预算日期，不删除已有记录、任务、日历和 FOOD 数据
*/
if(!data.budgetStart || !data.budgetEnd){

  const d=new Date();
  const y=d.getFullYear();
  const m=d.getMonth();

  data.budgetStart=
    data.budgetStart||
    `${y}-${String(m+1).padStart(2,"0")}-01`;

  data.budgetEnd=
    data.budgetEnd||
    `${y}-${String(m+1).padStart(2,"0")}-${String(new Date(y,m+1,0).getDate()).padStart(2,"0")}`;
}

let taskFilter="all";


function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
}


function money(n){
  return "¥"+Number(n||0).toFixed(2);
}


function localDate(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}


function localTimestamp(d=new Date()){
  return `${localDate(d)}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
}


function today(){
  return localDate();
}


function parseLocalDate(s){
  let [y,m,d]=String(s||"").split("-").map(Number);
  return new Date(y,m-1,d);
}


function budgetDays(){

  let s=parseLocalDate(data.budgetStart);
  let e=parseLocalDate(data.budgetEnd);

  if(
    Number.isNaN(s.getTime())||
    Number.isNaN(e.getTime())||
    e<s
  ){
    return 0;
  }

  return Math.floor((e-s)/86400000)+1;
}


function budgetStatus(){

  let t=parseLocalDate(today());
  let s=parseLocalDate(data.budgetStart);
  let e=parseLocalDate(data.budgetEnd);
  let total=budgetDays();

  if(!total){
    return {
      state:"invalid",
      elapsed:0,
      remaining:0,
      future:0,
      total:0
    };
  }

  if(t<s){
    return {
      state:"before",
      elapsed:0,
      remaining:total,
      future:total,
      total
    };
  }

  if(t>e){
    return {
      state:"after",
      elapsed:total,
      remaining:0,
      future:0,
      total
    };
  }

  let elapsed=Math.floor((t-s)/86400000);
  let remaining=total-elapsed;

  return {
    state:"active",
    elapsed,
    remaining,
    future:Math.max(0,remaining-1),
    total
  };
}


function monthKey(){
  let d=new Date();

  return d.getFullYear()+
    "-"+
    String(d.getMonth()+1).padStart(2,"0");
}


function monthRecords(){
  return data.records.filter(
    x=>String(x.date||"").slice(0,7)===monthKey()
  );
}


function budgetRecords(){

  let s=data.budgetStart;
  let e=data.budgetEnd;

  return data.records.filter(x=>{
    let day=String(x.date||"").slice(0,10);

    return day>=s && day<=e;
  });
}


function income(){

  return budgetRecords()
    .filter(x=>x.type==="income")
    .reduce((a,x)=>a+Number(x.amount),0);
}


function spent(){

  return budgetRecords()
    .filter(x=>x.type!=="income")
    .reduce((a,x)=>a+Number(x.amount),0);
}


function todaySpent(){

  return budgetRecords()
    .filter(x=>
      x.type!=="income" &&
      String(x.date||"").slice(0,10)===today()
    )
    .reduce((a,x)=>a+Number(x.amount),0);
}


function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}


function openModal(title,body){

  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").style.display="flex";
}


function closeModal(){
  document.getElementById("modal").style.display="none";
}


function jump(id){

  document.getElementById(id)
    .scrollIntoView({behavior:"smooth"});

  document
    .querySelectorAll("nav button")
    .forEach(b=>b.classList.remove("active"));

  event?.currentTarget?.classList.add("active");
}


function render(){

  let d=new Date();

  document.getElementById("date").textContent=
    d.toLocaleDateString(
      "zh-CN",
      {
        month:"long",
        day:"numeric",
        weekday:"long"
      }
    );

  let st=budgetStatus();
  let totalDays=st.total;

  document.getElementById("dayleft").textContent=
    st.state==="active"
      ?`预算剩 ${st.remaining} 天`
      :st.state==="before"
        ?`预算 ${totalDays} 天`
        :st.state==="after"
          ?"预算已结束"
          :"预算日期有误";


  let netSpent=spent();
  let totalIncome=income();

  let usable=Math.max(
    0,
    data.allowance+
    totalIncome-
    data.target-
    data.fixed
  );

  let remain=Math.max(
    0,
    usable-netSpent
  );

  let ts=todaySpent();

  let daily=0;
  let futureDaily=0;


  /* 预算尚未开始 */
  if(st.state==="before"){

    daily=
      totalDays?
      usable/totalDays:
      0;

    futureDaily=daily;
  }


  /* 预算进行中 */
  else if(st.state==="active"){

    /*
      beforeToday：
      如果把今天已经花掉的钱加回去，
      得到“今天开始时还剩多少预算”
    */
    let beforeToday=
      Math.max(
        0,
        remain+ts
      );

    /*
      今天开始时剩余预算 ÷ 剩余天数
      = 今天原本可以分到的额度
    */
    let baseToday=
      st.remaining?
      beforeToday/st.remaining:
      beforeToday;

    /*
      再直接扣除今天已经发生的支出
    */
    daily=
      Math.max(
        0,
        baseToday-ts
      );

    /*
      今天之后剩余预算重新分配
    */
    futureDaily=
      st.future?
      remain/st.future:
      remain;
  }


  document.getElementById("daily").textContent=
    money(daily);


  document.getElementById("allowance").textContent=
    money(data.allowance+totalIncome);

  document.getElementById("target").textContent=
    money(data.target);

  document.getElementById("spent").textContent=
    money(netSpent);

  document.getElementById("remain").textContent=
    money(remain);


  document.getElementById("budgetPeriod").textContent=
    `预算周期：${data.budgetStart} 至 ${data.budgetEnd} · 共 ${totalDays} 天`;


  document.getElementById("moneybar").style.width=
    Math.min(
      100,
      usable?
      netSpent/usable*100:
      0
    )+"%";


  let rate=
    usable?
    netSpent/usable:
    0;

  let health=
    document.getElementById("health");


  if(st.state==="before"){

    health.textContent="⏳";

    document.getElementById("moneyTip").textContent=
      `预算将于 ${data.budgetStart} 开始，开始后每日计划约 ${money(daily)}。`;
  }

  else if(st.state==="after"){

    health.textContent=
      remain>0?
      "🟢":
      "🔴";

    document.getElementById("moneyTip").textContent=
      "本预算周期已结束，可设置新的预算周期。";
  }

  else if(remain<=0){

    health.textContent="🔴";

    document.getElementById("moneyTip").textContent=
      "预算已用尽，后续消费需要重新调整。";
  }

  else if(rate>.8){

    health.textContent="🟡";

    document.getElementById("moneyTip").textContent=
      `消费偏快；今天剩余 ${money(daily)}，后续每天约 ${money(futureDaily)}。`;
  }

  else{

    health.textContent="🟢";

    document.getElementById("moneyTip").textContent=
      st.state==="active"
        ?`今天还可花 ${money(daily)}；后续每天约 ${money(futureDaily)}。`
        :"目前在计划内，可以按这个额度继续安排。";
  }


  let saved=Math.max(
    0,
    data.allowance+
    totalIncome-
    data.fixed-
    netSpent
  );


  document.getElementById("saveProgress").textContent=
    "预计可存 "+
    money(saved)+
    " / "+
    money(data.target);


  document.getElementById("forecast").textContent=
    saved>=data.target
      ?"目标可达成"
      :"还差 "+money(data.target-saved);


  document.getElementById("moneyAdvice").textContent=
    totalIncome
      ?`本预算周期有额外收入 ${money(totalIncome)}，已自动计入可用预算。`
      :"记入收入或支出后，预算、今日额度和储蓄预测都会自动更新。";


  let open=
    data.tasks.filter(x=>!x.done).length;

  let urgent=
    data.tasks.filter(
      x=>!x.done&&x.priority==="high"
    ).length;

  let near=
    data.tasks
      .filter(x=>!x.done&&x.deadline)
      .sort((a,b)=>
        a.deadline.localeCompare(b.deadline)
      )[0];


  document.getElementById("todayBrief").textContent=
    open
      ?`今天还有 ${open} 个未完成任务${urgent?"，其中 "+urgent+" 个高优先级":""}${near?`；最近 Deadline：${near.t}（${near.deadline}）`:""}。${todayEventsText()}`
      :"今天的任务已经完成得不错。"+todayEventsText();


  renderRecords();
  renderTasks();
  renderCalendar();
  renderFood();
  renderFoodLibrary();
}


function renderRecords(){

  let arr=
    monthRecords()
      .slice()
      .reverse()
      .slice(0,8);


  document.getElementById("expenseList").innerHTML=
    arr.length

      ?'<div class="muted" style="margin-top:14px">最近记录</div>'+
       arr.map(x=>
        `<div class="expense">
          <span>${x.type==="income"?"💵":"💸"}</span>

          <div style="flex:1">
            <b>${esc(x.note||x.cat||"未命名")}</b>
            <div class="muted">
              ${esc(x.cat||"")} · ${String(x.date||"").slice(0,10)}
            </div>
          </div>

          <strong>
            ${x.type==="income"?"+":"-"}${money(x.amount).slice(1)}
          </strong>

          <button
            class="btn danger"
            style="padding:7px 9px"
            onclick="delRecord('${x.id}')"
          >
            删
          </button>
        </div>`
       ).join("")

      :'<div class="empty">本月还没有记录。</div>';
}


function openRecord(){

  openModal(
    "记一笔 💰",

    `<div class="form">

      <label>
        类型
        <select id="r0">
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </label>

      <label>
        金额
        <input
          id="r1"
          type="number"
          inputmode="decimal"
          step="0.01"
          placeholder="例如 68"
        >
      </label>

      <label>
        类别
        <select id="r2">
          <option>🍚 吃饭</option>
          <option>🧋 饮料</option>
          <option>🚇 交通</option>
          <option>🛍️ 购物</option>
          <option>📚 学习</option>
          <option>🎮 娱乐</option>
          <option>💄 日用品</option>
          <option>🎁 红包/礼金</option>
          <option>💼 兼职/其他收入</option>
          <option>📦 其他</option>
        </select>
      </label>

      <label>
        备注
        <input
          id="r3"
          placeholder="例如 周边 / 午饭 / 红包"
        >
      </label>

      <button
        class="btn"
        onclick="addRecord()"
      >
        记录并重新计算
      </button>

    </div>`
  );
}


function addRecord(){

  let a=
    +document.getElementById("r1").value;

  if(!(a>0))return;

  data.records.push({

    id:String(Date.now()),

    amount:a,

    type:

function renderTasks(){

      .sort(
        (a,b)=>
          (a.done-b.done)||
          (a.deadline||"9999").localeCompare(
            b.deadline||"9999"
          )||
          (a.priority==="high"?0:a.priority==="mid"?1:2)-
          (b.priority==="high"?0:b.priority==="mid"?1:2)
      );


  document.getElementById("tasksList").innerHTML=

    arr.length

      ?arr.map(x=>
        `<div class="task">

          <input
            type="checkbox"
            ${x.done?"checked":""}
            onchange="toggleTask('${x.id}')"
          >

          <div style="flex:1">

            <div class="${x.done?"done":""}">
              ${esc(x.t)}
            </div>

            <div class="muted">
              ${x.deadline
                ?"截止 "+esc(x.deadline)
                :"无截止日期"}
              ${x.source
                ?` · ${esc(x.source)}`
                :""}
            </div>

          <span

              x.priority==="high"
                ?"high"
                :x.priority==="mid"
                  ?"mid"
                  :""
            }"
          >
            ${
              x.priority==="high"
                ?"高"

                  ?"中"
                  :"低"
            }

          <button
            class="btn danger"
            style="padding:7px 9px"
            onclick="delTask('${x.id}')"

            删

       ).join("")

      :'<div class="empty">没有符合条件的任务。</div>';


  ["taskAll","taskOpen","taskDone"]

function renderCalendar(){

  let now=new Date();

  let y=now.getFullYear();
  let m=now.getMonth();

  let first=new Date(y,m,1);
  let days=new Date(y,m+1,0).getDate();
  let offset=first.getDay();

  let cells="";


  for(let i=0;i<offset;i++){

    cells+=
      '<div class="calday blank"></div>';
  }


  for(let day=1;day<=days;day++){

    let ds=
      `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    let ts=
      data.tasks.filter(
        x=>x.deadline===ds
      );

    let es=
      data.events.filter(
        x=>x.date===ds
      );

    let todayCls=
      ds===today()
        ?" today"
        :"";

    let dots=[
      ...ts.map(x=>x.done?"✓":"•"),
      ...es.map(() => "+")
    ].slice(0,4);


    cells+=
      `<button
        class="calday${todayCls}"
        onclick="showCalendarDay('${ds}')"
      >
        <b>${day}</b>

        <span>
          ${dots.map(
            d=>`<i>${d}</i>`
          ).join("")}
        </span>

        ${
          ts.length
            ?`<em>${ts.length}</em>`
            :""
        }
      </button>`;
  }


  document.getElementById("calTabs").innerHTML=
    `<button onclick="changeMonth(-1)">‹</button>
     <button class="sel">${y}年${m+1}月</button>
     <button onclick="changeMonth(1)">›</button>
     <button onclick="jumpToday()">今天</button>`;


  document.getElementById("events").innerHTML=
    `<div class="calendar">

      <div class="week">
        ${["日","一","二","三","四","五","六"]
          .map(x=>`<b>${x}</b>`)
          .join("")}
      </div>

      <div class="monthgrid">
        ${cells}
      </div>

    </div>

    <div
      id="calDetail"
      class="status"
    >
      点日期查看当天 Deadline。任务的 Deadline 会自动出现在这里，无需重复录入。
    </div>`;


  window.calendarCursor={y,m};
}


function changeMonth(delta){

  let c=
    window.calendarCursor||
    {
      y:new Date().getFullYear(),
      m:new Date().getMonth()
    };

  let d=
    new Date(
      c.y,
      c.m+delta,
      1
    );

  window.calendarCursor={
    y:d.getFullYear(),
    m:d.getMonth()
  };

  renderCalendar();
}


function jumpToday(){

  window.calendarCursor={
    y:new Date().getFullYear(),
    m:new Date().getMonth()
  };

  renderCalendar();
  showCalendarDay(today());
}


function showCalendarDay(date){

  let ts=
    data.tasks.filter(
      x=>x.deadline===date
    );

  let es=
    data.events.filter(
      x=>x.date===date
    );

  let box=
    document.getElementById("calDetail");

  if(!box)return;


  let html=`<b>${date}</b>`;


  if(ts.length){

    html+=
      `<div style="margin-top:7px">
        ${
          ts.map(x=>
            `<div>
              📌 ${esc(x.t)}
              ${
                x.done
                  ?"✓"
                  :"· "+(
                    x.priority==="high"
                      ?"高优先级"
                      :""
                  )
              }
            </div>`
          ).join("")
        }
      </div>`;
  }


  if(es.length){

    html+=
      `<div style="margin-top:7px">
        ${
          es.map(x=>
            `<div>
              📅 ${esc(x.title)} · ${esc(x.type||"事项")}
            </div>`
          ).join("")
        }
      </div>`;
  }


  if(!ts.length&&!es.length){

    html+=
      `<div
        class="muted"
        style="margin-top:7px"
      >
        当天没有 Deadline。
      </div>`;
  }


  box.innerHTML=html;
}
