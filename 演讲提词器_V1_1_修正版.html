<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>演讲提词器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.app{max-width:760px;margin:auto;padding:20px 16px 40px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.logo{font-size:25px;font-weight:800;letter-spacing:-.06em}.sub{font-size:11px;color:#777}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:16px;margin-bottom:12px}h1{font-size:31px;letter-spacing:-.06em;margin:0 0 16px}h2{font-size:16px;margin:0 0 12px}textarea,input{font:inherit}textarea{width:100%;min-height:280px;padding:14px;border:1px solid #ddd;border-radius:14px;resize:vertical;line-height:1.7;outline:0}input[type=range]{width:100%}.row{display:flex;gap:8px}.btn{flex:1;border:0;border-radius:13px;padding:12px 10px;background:#111;color:#fff;font-weight:700}.btn.light{background:#eee;color:#111}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}.mode .on{background:#111;color:#fff;border-color:#111}.label{font-size:12px;color:#777;margin:13px 0 5px}.value{text-align:right;color:#777;font-size:12px;margin-top:3px}.hint{font-size:12px;line-height:1.55;color:#777}
#rec{display:none;position:fixed;inset:0;background:#000;z-index:5;color:#fff}.cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:rgba(0,0,0,.28)}.tele{position:absolute;left:5%;right:5%;top:22%;height:56%;overflow:hidden;display:flex;align-items:center}.words{width:100%;text-align:center;font-weight:700;font-size:35px;line-height:1.42;text-shadow:0 2px 9px #000;padding:28vh 0;transform:translateY(0);transition:transform .35s ease-out}.words span{display:block;opacity:.30;margin-bottom:20px;transition:opacity .2s}.words .now{opacity:1}.line{position:absolute;top:50%;left:4%;right:4%;border-top:1px solid #ffffff66}.topbar{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px}.ctrl{position:absolute;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}.ctrl button{border:1px solid #ffffff44;background:#000a;color:#fff;border-radius:12px;padding:10px 12px}.clock{margin-left:auto;font-size:12px}.toast{display:none;position:fixed;z-index:20;bottom:30px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px}</style></head><body>
<div class="app"><div class="head"><div class="logo">SPEECH</div><div class="sub">演讲提词器 · V1</div></div><h1>我的演讲</h1>
<div class="card"><h2>完整演讲稿</h2><textarea id="script" placeholder="把完整演讲稿粘贴到这里……"></textarea><div class="row" style="margin-top:8px"><button class="btn light" id="save">保存</button><button class="btn light" id="load">载入</button><button class="btn light" id="clear">清空</button></div></div>
<div class="card"><h2>显示模式</h2><div class="mode"><button class="on" data-m="full">全文显示</button><button data-m="key">提示词</button></div></div>
<div class="card"><h2>提词设置</h2><div class="label">目标时长（分钟）</div><input id="duration" type="number" min="0.5" max="20" step="0.1" value="3" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:12px"><div class="label">滚动速度</div><input id="speed" type="range" min="0.6" max="1.6" value="1" step="0.05"><div class="value" id="sv">1.00×</div><div class="label">字体大小</div><input id="font" type="range" min="22" max="64" value="35"><div class="value" id="fv">35 px</div><div class="label">文字区域高度</div><input id="area" type="range" min="25" max="70" value="48"><div class="value" id="av">48%</div><div class="label">文字位置</div><input id="top" type="range" min="15" max="60" value="30"><div class="value" id="tv">30%</div></div>
<div class="card"><h2>语音跟随</h2><div class="row"><button class="btn light" id="voice">开启语音跟随</button><div id="vs" class="hint" style="flex:1;padding:9px">未开启</div></div><p class="hint">录像时识别你正在说的英文，并尝试把当前句跟到你读到的位置。识别不稳定时自动滚动仍可用。</p></div>
<div class="card"><button class="btn" id="start" style="width:100%;font-size:17px">进入录像提词</button><p class="hint">首次需要允许摄像头和麦克风。建议用 Safari/Chrome 在 HTTPS 网页打开。</p></div></div>
<div id="rec"><video id="cam" class="cam" autoplay playsinline muted></video><div class="shade"></div><div class="tele"><div id="words" class="words"></div></div><div class="line"></div><div class="topbar"><button id="exit">退出</button></div><div class="ctrl"><button id="record">● 开始录制</button><button id="pause" style="display:none">暂停</button><button id="reset">↺</button><div id="clock" class="clock">00:00</div></div></div><div id="toast" class="toast"></div>
<script>
const $=x=>document.getElementById(x);let mode='full',stream=null,media=null,chunks=[],rec=false,paused=false,start=0,timer=null,raf=null,current=0,voiceOn=false,recognition=null;
const parts=()=>$("script").value.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
 let p=parts();
 if(!p.length){$('words').textContent='请先输入演讲稿';return}
 $('words').innerHTML=p.map((x,i)=>{
   let t=x;
   if(mode==='key'){let w=x.match(/[A-Za-z][A-Za-z'’-]*/g)||[];t=w.slice(0,6).join(' ')||x.slice(0,20)}
   return `<span class="${i===current?'now':''}">${esc(t)}</span>`
 }).join('');
 requestAnimationFrame(()=>{
   const box=document.querySelector('.tele');
   const word=$('words');
   const el=word.children[current];
   if(!box||!el)return;
   const target=el.offsetTop + el.offsetHeight/2 - box.clientHeight/2;
   word.style.transform=`translateY(${-target}px)`;
 });
}
function apply(){let s=$('speed').value,f=$('font').value,a=$('area').value,t=$('top').value;$('sv').textContent=(+s).toFixed(2)+'×';$('fv').textContent=f+' px';$('av').textContent=a+'%';$('tv').textContent=t+'%';$('words').style.fontSize=f+'px';document.querySelector('.tele').style.height=a+'%';document.querySelector('.tele').style.top=t+'%'}
['speed','font','area','top'].forEach(id=>$(id).oninput=apply);document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;render()});
$('save').onclick=()=>{localStorage.setItem('speech_script',$('script').value);toast('已保存')};$('load').onclick=()=>{$('script').value=localStorage.getItem('speech_script')||'';render();toast('已载入')};$('clear').onclick=()=>{$('script').value='';render()};
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}
$('start').onclick=async()=>{if(!$("script").value.trim())return toast('先粘贴演讲稿');$('rec').style.display='block';current=0;render();apply();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});$('cam').srcObject=stream}catch(e){toast('摄像头/麦克风权限未打开')}};
$('exit').onclick=()=>{stop();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('rec').style.display='none';stopVoice()};$('reset').onclick=()=>{current=0;render()};
function clock(){let s=Math.floor((Date.now()-start)/1000),m=Math.floor(s/60);s%=60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function auto(){let p=parts();if(!p.length)return;let total=(+$('duration').value||3)*60/(+$('speed').value||1),i=Math.min(p.length-1,Math.floor(((Date.now()-start)/1000)/total*p.length));if(i!==current){current=i;render()}if(rec&&!paused)raf=requestAnimationFrame(auto)}
$('record').onclick=()=>{if(media&&media.state==='recording'){stop();return}if(!stream)return toast('摄像头还没打开');chunks=[];let type=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm');try{media=new MediaRecorder(stream,{mimeType:type})}catch(e){media=new MediaRecorder(stream)}media.ondataavailable=e=>e.data.size&&chunks.push(e.data);media.onstop=()=>{let b=new Blob(chunks,{type:media.mimeType}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='speech-recording.'+(media.mimeType.includes('mp4')?'mp4':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('录像已生成')};media.start(250);rec=true;paused=false;start=Date.now();timer=setInterval(clock,250);$('record').textContent='■ 停止录制';$('pause').style.display='block';raf=requestAnimationFrame(auto);if(voiceOn)startVoice()};
function stop(){if(media&&media.state!=='inactive')media.stop();rec=false;clearInterval(timer);cancelAnimationFrame(raf);$('record').textContent='● 开始录制';$('pause').style.display='none'}$('pause').onclick=()=>{paused=!paused;if(media){if(paused&&media.state==='recording')media.pause();if(!paused&&media.state==='paused')media.resume()}$('pause').textContent=paused?'继续':'暂停';if(!paused)raf=requestAnimationFrame(auto)};
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim()}
function follow(s){let p=parts(),q=norm(s),best=current,scoreBest=0;for(let i=Math.max(0,current-1);i<Math.min(p.length,current+7);i++){let w=norm(p[i]).split(' ').filter(Boolean);let score=w.filter(x=>x.length>2&&q.includes(x)).length/Math.min(8,w.length);let first=w.slice(0,8).join(' ');if(first&&q.includes(first.slice(0,18)))score+=1;if(score>scoreBest){scoreBest=score;best=i}}if(scoreBest>.55&&best!==current){current=best;render()}}
function makeRecognition(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;let r=new R();r.lang='en-US';r.continuous=true;r.interimResults=true;r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';follow(t)};r.onerror=()=>{$('vs').textContent='识别中断，可继续自动滚动'};r.onend=()=>{if(voiceOn&&rec)try{r.start()}catch(e){}};return r}
function startVoice(){if(!recognition)recognition=makeRecognition();if(!recognition)return toast('当前浏览器不支持语音跟随');try{recognition.start();$('vs').textContent='正在听你讲话'}catch(e){}}
function stopVoice(){if(recognition)try{recognition.stop()}catch(e){}if(voiceOn)$('vs').textContent='已开启'}$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent=voiceOn?'关闭语音跟随':'开启语音跟随';$('vs').textContent=voiceOn?'等待录像开始':'未开启';if(!voiceOn)stopVoice();else if(rec)startVoice()};apply();render();
</script></body></html>
