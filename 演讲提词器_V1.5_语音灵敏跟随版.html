<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f2">
<title>演讲提词器</title>
<style>
:root{--bg:#f5f5f2;--fg:#111;--muted:#777;--line:#dededb;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{border:0}body{min-height:100vh}.app{max-width:820px;margin:auto;padding:18px 16px 42px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-weight:850;font-size:25px;letter-spacing:-.06em}.ver{font-size:11px;color:var(--muted)}
h1{font-size:34px;letter-spacing:-.06em;margin:0 0 18px}h2{font-size:16px;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px}
textarea,input,select{border:1px solid var(--line);border-radius:13px;background:#fff;color:#111;outline:none}
input[type=text],input[type=number],select{width:100%;padding:11px 12px}.titleInput{font-weight:700;font-size:16px}
textarea{width:100%;min-height:250px;padding:14px;line-height:1.7;resize:vertical}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{padding:12px 13px;border-radius:13px;background:#111;color:#fff;font-weight:750}.btn.light{background:#eee;color:#111}.btn.compact{padding:9px 11px;font-size:13px}
.library{display:grid;grid-template-columns:1fr;gap:8px}.speechItem{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;background:#fff}.speechItem.active{border-color:#111}.speechInfo{min-width:0;flex:1}.speechTitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.speechMeta{font-size:11px;color:var(--muted);margin-top:3px}.iconBtn{padding:8px 10px;border-radius:10px;background:#eee;color:#111}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.mode button.on{background:#111;color:#fff;border-color:#111}
.promptEditor{margin-top:12px}.label{font-size:12px;color:var(--muted);margin:13px 0 6px}.value{text-align:right;font-size:12px;color:var(--muted);margin-top:3px}.hint{font-size:12px;line-height:1.55;color:var(--muted)}input[type=range]{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:13px;padding:10px 0}.check input{width:18px;height:18px}
.status{font-size:12px;color:var(--muted)}
#rec{display:none;position:fixed;inset:0;background:#050505;color:#fff;z-index:50;overflow:hidden}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.25);pointer-events:none}
#viewport{position:absolute;left:4%;right:4%;top:16%;height:68%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#viewport::-webkit-scrollbar{display:none}
#track{width:100%;padding:40vh 5% 40vh;transform:none}
.seg{font-size:30px;line-height:1.45;font-weight:720;text-align:center;margin:0 0 26px;text-shadow:0 2px 10px #000;opacity:.62;transition:opacity .15s}
.seg.current{opacity:1}.keywordSeg{font-size:35px;font-weight:850;letter-spacing:-.02em;margin-bottom:38px}
#readLine{position:absolute;left:4%;right:4%;top:50%;border-top:1px solid rgba(255,255,255,.52);pointer-events:none}
.recTop{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.overlayBtn{background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:9px 12px}
.controls{position:absolute;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:3}.controls button{background:rgba(0,0,0,.68);color:#fff;border:1px solid rgba(255,255,255,.24);border-radius:12px;padding:10px 12px}.clock{margin-left:auto;font-size:12px}
.recState{position:absolute;left:50%;transform:translateX(-50%);top:max(62px,calc(env(safe-area-inset-top) + 45px));font-size:12px;background:rgba(0,0,0,.5);border-radius:999px;padding:7px 10px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3b30;margin-right:5px}
#result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:80;align-items:center;justify-content:center;padding:20px}.resultBox{max-width:420px;width:100%;background:#fff;color:#111;border-radius:20px;padding:18px}.resultBox h2{font-size:20px}.resultActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resultActions>*{min-width:0;text-align:center;text-decoration:none}.resultActions #shareVideo{grid-column:1/-1}.error{color:#b42318;background:#fff0ed;border:1px solid #f3c6be;border-radius:12px;padding:10px;margin-top:10px;font-size:12px;line-height:1.5;display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;display:none}
@media(min-width:700px){.app{padding-top:28px}.seg{font-size:34px}}

.positionHint{position:absolute;z-index:5;left:50%;top:calc(env(safe-area-inset-top) + 52px);transform:translateX(-50%);background:rgba(0,0,0,.62);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:7px 11px;font-size:12px;display:none;touch-action:none}
#viewport.dragging{outline:1px dashed rgba(255,255,255,.7);outline-offset:-4px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">SPEECH</div><div class="ver">演讲提词器 · V1.5</div></div>
  <h1>我的演讲</h1>

  <section class="card">
    <h2>演讲库</h2>
    <div id="library" class="library"></div>
    <button id="newSpeech" class="btn light compact" style="width:100%;margin-top:8px">＋ 新建演讲</button>
  </section>

  <section class="card">
    <h2>演讲稿</h2>
    <input id="title" class="titleInput" type="text" placeholder="演讲标题">
    <div style="height:8px"></div>
    <textarea id="script" placeholder="把完整演讲稿粘贴到这里……"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="saveSpeech" class="btn">保存演讲</button>
      <button id="deleteSpeech" class="btn light">删除</button>
    </div>
  </section>

  <section class="card">
    <h2>显示模式</h2>
    <div class="mode">
      <button class="on" data-mode="full">全文显示</button>
      <button data-mode="key">提示词</button>
    </div>
    <div id="promptEditor" class="promptEditor" style="display:none">
      <div class="label">提示词（每行对应一个提词段）</div>
      <textarea id="prompts" style="min-height:150px" placeholder="例如：Small habit → repeat → real change"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="autoPrompt" class="btn light compact">自动生成提示词</button>
        <button id="savePrompt" class="btn light compact">保存提示词</button>
      </div>
    </div>
    <p class="hint" style="margin-bottom:0">全文模式显示完整稿并连续滚动；提示词模式只显示你设置的关键词。</p>
  </section>

  <section class="card">
    <h2>提词设置</h2>
    <div class="label">目标时长</div>
    <div class="row"><input id="duration" type="number" min=".5" max="30" step=".1" value="3"><span style="flex:0 0 auto;font-size:13px">分钟</span></div>

    <div class="label">滚动速度微调</div>
    <input id="speed" type="range" min=".7" max="1.5" step=".05" value="1"><div class="value" id="speedV">1.00×</div>

    <div class="label">字体大小</div>
    <input id="font" type="range" min="22" max="52" value="30"><div class="value" id="fontV">30 px</div>

    <div class="label">文字区域高度</div>
    <input id="area" type="range" min="45" max="88" value="45"><div class="value" id="areaV">45%</div>

    <div class="label">文字区域位置</div>
    <input id="top" type="range" min="4" max="55" value="10"><div class="value" id="topV">10%</div>

    <label class="check"><input id="voiceOn" type="checkbox"> 开启语音跟随（识别我读到哪里）</label>
    <label class="check"><input id="mirror" type="checkbox" checked> 前置摄像头镜像</label>
  </section>

  <section class="card">
    <button id="start" class="btn" style="width:100%;font-size:17px">进入录像提词</button>
    <p class="hint">录像界面会直接调用摄像头和麦克风。提词文字只是屏幕叠加层，录出来的视频默认不把提词文字写进画面。</p>
    <div id="error" class="error"></div>
  </section>
</div>

<div id="rec">
  <video id="cam" autoplay playsinline muted></video>
  <div id="shade"></div>
  <div id="viewport"><div id="track"></div></div>
  <div id="readLine"></div>
  <div class="recTop">
    <button id="exit" class="overlayBtn">退出</button>
    <button id="voiceState" class="overlayBtn">语音跟随：关</button>
    <button id="positionBtn" class="overlayBtn">字幕位置</button>
  </div>
  <div id="positionHint" class="positionHint">拖动字幕到前置摄像头附近 · 再点一次完成</div>
  <div id="recState" class="recState">预览中</div>
  <div class="controls">
    <button id="record">● 开始录制</button>
    <button id="pause" style="display:none">暂停</button>
    <button id="resumeAuto">自动</button>
    <button id="reset">↺</button>
    <div id="clock" class="clock">00:00</div>
  </div>
</div>

<div id="result">
  <div class="resultBox">
    <h2>录像完成</h2>
    <p class="hint">提词没有写进录像画面。你可以保存视频文件，或使用系统分享菜单处理它。</p>
    <div class="resultActions">
      <button id="shareVideo" class="btn">分享 / 保存到相册</button>
      <a id="downloadVideo" class="btn light" href="#" download="speech-recording.mp4">下载视频</a>
      <button id="closeResult" class="btn light">关闭</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);

let library=[];
let activeId=null;
let mode='full';
let stream=null;
let media=null;
let chunks=[];
let recording=false;
let paused=false;
let autoRunning=false;
let manualOverride=false;
let startTime=0;
let elapsedBeforePause=0;
let frame=null;
let clockTimer=null;
let recognition=null;
let voiceEnabled=false;
let voiceFinalText='';
let voiceInterimText='';
let lastVoiceIndex=-1;
let lastVoiceAt=0;
let currentIndex=0;
let segments=[];
let resultUrl=null;
let dragMode=false,dragStartY=0,dragStartTop=10;
const POS_KEY="speech_teleprompter_position_v1";

function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>{$('toast').style.display='none'},1800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function saveLibrary(){localStorage.setItem('speech_teleprompter_library',JSON.stringify(library))}
function activeSpeech(){return library.find(x=>x.id===activeId)||null}

function loadLibrary(){
  try{library=JSON.parse(localStorage.getItem('speech_teleprompter_library')||'[]')}catch(e){library=[]}
  if(!library.length){
    const old=localStorage.getItem('speech_script')||'';
    const d={id:uid(),title:'我的第一篇演讲',script:old,prompts:''};
    library=[d];
  }
  activeId=library[0].id;
  renderLibrary(); loadEditor();
}
function renderLibrary(){
  const box=$('library');
  if(!library.length){box.innerHTML='<div class="hint">还没有演讲稿。</div>';return}
  box.innerHTML=library.map(s=>{
    const words=(s.script.match(/\S+/g)||[]).length;
    return `<div class="speechItem ${s.id===activeId?'active':''}" data-id="${s.id}">
      <div class="speechInfo"><div class="speechTitle">${esc(s.title||'未命名演讲')}</div><div class="speechMeta">${words} 词</div></div>
      <button class="iconBtn" data-open="${s.id}">打开</button>
    </div>`
  }).join('');
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{activeId=b.dataset.open;renderLibrary();loadEditor()})
}
function loadEditor(){
  const s=activeSpeech();if(!s)return;
  $('title').value=s.title||'';
  $('script').value=s.script||'';
  $('prompts').value=s.prompts||'';
  mode='full';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode==='full'));
  $('promptEditor').style.display='none';
}
$('newSpeech').onclick=()=>{
  const s={id:uid(),title:'新演讲',script:'',prompts:''};
  library.unshift(s);activeId=s.id;saveLibrary();renderLibrary();loadEditor();$('title').focus();
}
$('saveSpeech').onclick=()=>{
  let s=activeSpeech();if(!s){s={id:uid(),title:'新演讲',script:'',prompts:''};library.unshift(s);activeId=s.id}
  s.title=$('title').value.trim()||'未命名演讲';s.script=$('script').value;s.prompts=$('prompts').value;saveLibrary();renderLibrary();toast('演讲已保存')
}
$('deleteSpeech').onclick=()=>{
  if(library.length<=1){toast('至少保留一篇演讲');return}
  library=library.filter(x=>x.id!==activeId);activeId=library[0].id;saveLibrary();renderLibrary();loadEditor()
}
$('autoPrompt').onclick=()=>{
  const seg=splitSegments($('script').value);
  $('prompts').value=seg.map(x=>{
    const w=x.match(/[A-Za-z][A-Za-z'’-]*/g)||[];
    return w.slice(0,6).join(' • ')||x.slice(0,20);
  }).join('\n');
  toast('已生成提示词，可继续自己修改')
}
$('savePrompt').onclick=()=>{
  const s=activeSpeech();if(!s)return;s.prompts=$('prompts').value;saveLibrary();toast('提示词已保存')
}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  mode=b.dataset.mode;$('promptEditor').style.display=mode==='key'?'block':'none';
})

function splitSegments(text){
  const raw=text.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const block of raw){
    const bits=block.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[block];
    for(const bit of bits.map(x=>x.trim()).filter(Boolean))out.push(bit);
  }
  return out;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function buildTrack(){
  const s=activeSpeech();
  const full=splitSegments(s?s.script:$('script').value);
  segments=full;
  currentIndex=0;
  let shown=full;
  if(mode==='key'){
    const custom=(s?s.prompts:$('prompts').value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
    shown=custom.length?custom:full.map(x=>((x.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).slice(0,6).join(' • ')||x.slice(0,20)));
    segments=shown.map((text,i)=>({text,fullIndex:i}));
  }else{
    segments=full.map((text,i)=>({text,fullIndex:i}));
  }
  if(!shown.length){$('track').innerHTML='<div class="seg current">请先输入演讲稿</div>';return}
  $('track').innerHTML=shown.map((text,i)=>`<div class="seg ${i===0?'current':''}">${esc(text)}</div>`).join('');
  updateClasses();
  requestAnimationFrame(()=>scrollToCurrent(false));
}
function updateClasses(){
  [...$('track').children].forEach((el,i)=>el.classList.toggle('current',i===currentIndex))
}
function scrollToCurrent(smooth=true){
  const el=$('track').children[currentIndex];if(!el)return;
  el.scrollIntoView({block:'center',behavior:smooth?'smooth':'auto'});
}
function loadPosition(){
  try{const v=JSON.parse(localStorage.getItem(POS_KEY)||"null");if(v&&Number.isFinite(v.top)){const t=Math.max(4,Math.min(55,v.top));$("top").value=t}}catch(e){}
}
function savePosition(){localStorage.setItem(POS_KEY,JSON.stringify({top:+$("top").value}))}
function setDragMode(on){
  dragMode=on;$('positionHint').style.display=on?'block':'none';$('viewport').classList.toggle('dragging',on);
  $('positionBtn').textContent=on?'完成':'字幕位置';
  if(on){dragStartY=0;dragStartTop=+$('top').value;toast('直接拖动字幕区域调整位置')}
  else savePosition();
}
$('positionBtn').onclick=()=>setDragMode(!dragMode);
$('viewport').addEventListener('pointerdown',e=>{if(!dragMode)return;dragStartY=e.clientY;dragStartTop=+$('top').value;$('viewport').setPointerCapture(e.pointerId);});
$('viewport').addEventListener('pointermove',e=>{if(!dragMode||!dragStartY)return;const delta=(e.clientY-dragStartY)/window.innerHeight*100;const t=Math.max(4,Math.min(55,dragStartTop+delta));$('top').value=t;applySettings();});
$('viewport').addEventListener('pointerup',e=>{if(dragMode){dragStartY=0;savePosition();}});

function applySettings(){
  const f=+$('font').value,a=+$('area').value,t=+$('top').value;
  $('fontV').textContent=f+' px';$('areaV').textContent=a+'%';$('topV').textContent=t+'%';$('speedV').textContent=(+$('speed').value).toFixed(2)+'×';
  [...$('track').children].forEach(el=>el.style.fontSize=(mode==='key'?Math.max(f,30):f)+'px');
  $('viewport').style.height=a+'%';$('viewport').style.top=t+'%';
  $('cam').style.transform=$('mirror').checked?'scaleX(-1)':'none';
}
['font','area','top','speed'].forEach(id=>$(id).oninput=()=>{applySettings();if(id==='top')savePosition()});
$('mirror').onchange=applySettings;

async function openCamera(){
  $('error').style.display='none';
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showError('当前页面不是可用的安全网页环境。请从 GitHub Pages 的 https:// 地址打开，不要直接双击 html 文件。');return false;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:true});
    $('cam').srcObject=stream;
    return true;
  }catch(e){
    let msg='摄像头/麦克风打开失败。';
    if(e.name==='NotAllowedError')msg+='你拒绝了浏览器权限，请在 Safari 地址栏的网站设置里允许摄像头和麦克风。';
    else if(e.name==='NotFoundError')msg+='没有找到可用的摄像头或麦克风。';
    else if(e.name==='NotReadableError')msg+='摄像头可能正被其他 App 占用。';
    else if(e.name==='SecurityError')msg+='浏览器安全策略阻止了访问，请从 HTTPS 网页打开。';
    else msg+='错误类型：'+(e.name||'未知错误')+'。';
    showError(msg);return false;
  }
}
function showError(msg){$('error').textContent=msg;$('error').style.display='block';toast('没能打开摄像头')}
$('start').onclick=async()=>{
  const s=activeSpeech();
  if(!s||!s.script.trim()){toast('先输入并保存演讲稿');return}
  $('rec').style.display='block';buildTrack();applySettings();
  const ok=await openCamera();
  if(!ok){$('rec').style.display='none';return}
  $('voiceState').textContent=voiceEnabled?'语音跟随：开':'语音跟随：关';
  $('recState').textContent='预览中 · 点击开始录制';
}
$('exit').onclick=()=>exitRecorder();
function exitRecorder(){
  stopRecording();
  stopVoiceRecognition();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;$('rec').style.display='none';
}
$('reset').onclick=()=>{currentIndex=0;manualOverride=false;elapsedBeforePause=0;renderPosition()}
function renderPosition(){updateClasses();scrollToCurrent(true)}
$('resumeAuto').onclick=()=>{manualOverride=false;autoRunning=true;toast('已恢复自动跟随')}

function currentSeconds(){return recording?elapsedBeforePause+(Date.now()-startTime)/1000:elapsedBeforePause}
function updateClock(){
  const sec=Math.floor(currentSeconds()),m=Math.floor(sec/60),s=sec%60;
  $('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function startAuto(){
  cancelAnimationFrame(frame);autoRunning=true;
  frame=requestAnimationFrame(autoLoop);
}
function autoLoop(){
  if(!recording||paused||manualOverride){frame=null;return}
  const viewport=$('viewport'),max=Math.max(0,viewport.scrollHeight-viewport.clientHeight);
  const dur=Math.max(1,(+$('duration').value||3)*60/(+$('speed').value||1));
  // 语音跟随开启时，预设滚动只作为“平滑兜底”；语音识别一旦有新结果立即接管。
  const p=Math.min(1,currentSeconds()/dur);
  const target=max*p;
  if(!voiceEnabled || Date.now()-lastVoiceAt>900){
    const gap=target-viewport.scrollTop;
    viewport.scrollTop += Math.max(-3.2,Math.min(3.2,gap*0.075));
  }
  frame=requestAnimationFrame(autoLoop);
}

$('viewport').addEventListener('pointerdown',()=>{if(recording){manualOverride=true;toast('已切换为手动滚动，点“自动”恢复')}});

function startRecording(){
  if(!stream){toast('摄像头还没打开');return}
  chunks=[];
  let mime='';
  const choices=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const x of choices){if(window.MediaRecorder&&MediaRecorder.isTypeSupported(x)){mime=x;break}}
  try{media=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){toast('当前浏览器不支持录像');return}
  media.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)}
  media.onstop=finishRecording;
  media.start(250);
  recording=true;paused=false;manualOverride=false;elapsedBeforePause=0;startTime=Date.now();
  $('record').textContent='■ 停止录制';$('pause').style.display='block';$('recState').innerHTML='<span class="dot"></span>录制中';
  clockTimer=setInterval(updateClock,250);startAuto();
  if(voiceEnabled)startVoiceRecognition();
}
function stopRecording(){
  if(media&&media.state!=='inactive'){media.stop()}
  recording=false;paused=false;autoRunning=false;clearInterval(clockTimer);cancelAnimationFrame(frame);
  $('record').textContent='● 开始录制';$('pause').style.display='none';$('recState').textContent='预览中';
}
$('record').onclick=()=>{if(recording)stopRecording();else startRecording()}
$('pause').onclick=()=>{
  if(!recording||!media)return;
  paused=!paused;
  if(paused){
    elapsedBeforePause+=((Date.now()-startTime)/1000);media.pause();$('pause').textContent='继续';$('recState').textContent='已暂停';cancelAnimationFrame(frame)
  }else{
    startTime=Date.now();media.resume();$('pause').textContent='暂停';$('recState').innerHTML='<span class="dot"></span>录制中';startAuto()
  }
}

function finishRecording(){
  if(!chunks.length){toast('没有生成录像数据');return}
  const type=media.mimeType||'video/webm';
  const blob=new Blob(chunks,{type});
  if(resultUrl)URL.revokeObjectURL(resultUrl);
  resultUrl=URL.createObjectURL(blob);
  $('downloadVideo').href=resultUrl;
  $('downloadVideo').download='speech-recording.'+(type.includes('mp4')?'mp4':'webm');
  $('result').style.display='flex';
}
$('closeResult').onclick=()=>{$('result').style.display='none'};

function normalize(s){return s.toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim()}
function startVoiceRecognition(){
  stopVoiceRecognition();
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){$('voiceState').textContent='语音跟随：不支持';$('recState').textContent='录制中 · 语音识别不可用';return}
  voiceFinalText='';voiceInterimText='';lastVoiceIndex=-1;lastVoiceAt=0;
  recognition=new R();
  recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;
  recognition.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript||'';
      if(e.results[i].isFinal) voiceFinalText+=' '+t;
      else interim+=' '+t;
    }
    voiceInterimText=interim;
    const recent=normalize((voiceFinalText+' '+voiceInterimText).split(' ').slice(-45).join(' '));
    if(recent)followSpeech(recent);
  };
  recognition.onerror=()=>{$('voiceState').textContent='语音跟随：识别中断';};
  recognition.onend=()=>{if(voiceEnabled&&recording)try{recognition.start()}catch(e){}};
  try{recognition.start();$('voiceState').textContent='语音跟随：开'}catch(e){$('voiceState').textContent='语音跟随：启动失败'}
}
function stopVoiceRecognition(){if(recognition)try{recognition.stop()}catch(e){}recognition=null;voiceFinalText='';voiceInterimText=''}
function followSpeech(spoken){
  if(!segments.length)return;
  const q=normalize(spoken);if(!q)return;
  const qWords=q.split(' ').filter(Boolean);
  let best=Math.max(0,currentIndex),bestScore=0;
  // 只向前看，避免识别中的零碎结果把字幕突然拉回前面。
  const start=Math.max(0,currentIndex-1),end=Math.min(segments.length,currentIndex+12);
  for(let i=start;i<end;i++){
    const text=normalize(segments[i].text);
    const w=text.split(' ').filter(Boolean);if(!w.length)continue;
    let matched=0;
    for(const word of w){
      if(word.length>1 && qWords.includes(word))matched++;
    }
    const prefix=w.slice(0,Math.min(5,w.length)).join(' ');
    const tail=w.slice(-4).join(' ');
    let score=matched/Math.min(w.length,8);
    if(prefix && q.includes(prefix))score+=1.25;
    if(tail && q.includes(tail))score+=0.65;
    if(i===currentIndex)score+=0.08;
    // 越靠近当前阅读位置越优先，但只有匹配足够强才推进。
    score-=Math.max(0,i-currentIndex)*0.012;
    if(score>bestScore){bestScore=score;best=i}
  }
  if(bestScore>=0.42 && best!==currentIndex){
    currentIndex=best;lastVoiceIndex=best;lastVoiceAt=Date.now();manualOverride=false;updateClasses();
    // 不使用 smooth，避免动画追不上真实语速；识别结果一到就立刻定位。
    scrollToCurrent(false);
  }else if(bestScore>=0.25){
    lastVoiceAt=Date.now();
  }
}
$('voiceOn').onchange=e=>{voiceEnabled=e.target.checked;$('voiceState').textContent=voiceEnabled?'语音跟随：开':'语音跟随：关'};


async function shareVideoFile(){
  if(!chunks.length){toast('没有可分享的录像');return}
  const type=(media&&media.mimeType)||'video/mp4';
  const ext=type.includes('mp4')?'mp4':'webm';
  const file=new File(chunks,'speech-recording.'+ext,{type});
  try{
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({
        title: '演讲录像',
        text: '我的演讲录像',
        files: [file]
      });
      return;
    }
    toast('当前浏览器不能直接调出视频分享，请用“下载视频”');
  }catch(e){
    if(e && e.name==='AbortError') return;
    toast('分享未完成，请改用“下载视频”');
  }
}
$('shareVideo').onclick=shareVideoFile;

loadPosition();
loadLibrary();
applySettings();

</script>
