<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>演讲提词器</title>
<style>
:root{--bg:#f6f6f3;--fg:#111;--muted:#767676;--line:#ddd;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
button,input,textarea{font:inherit}button{border:0;cursor:pointer}
.app{max-width:820px;margin:auto;padding:18px 16px 42px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:25px;font-weight:850;letter-spacing:-.06em}.ver{font-size:11px;color:var(--muted)}
h1{font-size:34px;letter-spacing:-.06em;margin:0 0 18px}h2{font-size:16px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px}
input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;color:#111;outline:none}
input[type=text],input[type=number]{padding:11px 12px}.titleInput{font-weight:700;font-size:16px}
textarea{min-height:250px;padding:14px;line-height:1.7;resize:vertical}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{padding:12px 13px;border-radius:13px;background:#111;color:#fff;font-weight:750}.btn.light{background:#eee;color:#111}.btn.small{padding:9px 11px;font-size:13px}
.library{display:grid;gap:8px}.speech{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px}.speech.active{border-color:#111}.speechInfo{min-width:0;flex:1}.speechTitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.speechMeta{font-size:11px;color:var(--muted);margin-top:3px}.openBtn{background:#eee;border-radius:10px;padding:8px 10px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{padding:13px;border:1px solid var(--line);background:#fff;border-radius:13px}.mode button.active{background:#111;color:#fff;border-color:#111}
.label{font-size:12px;color:var(--muted);margin:13px 0 6px}.value{text-align:right;font-size:12px;color:var(--muted);margin-top:3px}.hint{font-size:12px;line-height:1.55;color:var(--muted)}
input[type=range]{width:100%}.switch{display:flex;gap:8px;align-items:center;font-size:13px;padding:9px 0}.switch input{width:18px;height:18px}
#stage{display:none;position:fixed;inset:0;z-index:50;background:#000;color:#fff;overflow:hidden}
#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.24);pointer-events:none}
#teleText{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:2}
#teleText::-webkit-scrollbar{display:none}
#track{min-height:100%;padding:46vh 6vw 50vh}
.line{font-weight:760;text-align:center;font-size:34px;line-height:1.42;letter-spacing:-.02em;text-shadow:0 2px 11px #000;margin:0 auto 32px;max-width:1000px;opacity:.47;transition:opacity .15s,transform .15s}.line.active{opacity:1;transform:scale(1.01)}
#focusLine{position:absolute;left:3%;right:3%;top:50%;border-top:1px solid rgba(255,255,255,.32);z-index:3;pointer-events:none}
#topBar{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;z-index:5}.ghost{background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:9px 12px}
#recState{position:absolute;top:max(58px,calc(env(safe-area-inset-top) + 42px));left:50%;transform:translateX(-50%);z-index:5;background:rgba(0,0,0,.52);padding:6px 10px;border-radius:999px;font-size:11px;white-space:nowrap}
#bottomBar{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:5}.bottomBtn{background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.24);color:#fff;border-radius:12px;padding:10px 12px}.clock{margin-left:auto;font-size:12px}
#debug{position:absolute;left:10px;right:10px;bottom:max(65px,calc(env(safe-area-inset-bottom) + 55px));z-index:5;display:none;background:rgba(0,0,0,.55);border-radius:10px;padding:7px 9px;font-size:11px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#error{display:none;margin-top:10px;background:#fff0ed;color:#a02c1d;border:1px solid #f2c5bc;border-radius:12px;padding:10px;font-size:12px;line-height:1.5}
#result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;align-items:center;justify-content:center;padding:20px}.resultBox{width:min(430px,100%);background:#fff;color:#111;border-radius:20px;padding:18px}.resultActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resultActions>*{text-align:center;text-decoration:none}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;display:none}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">SPEECH</div><div class="ver">V1.5</div></div>
<h1>我的演讲</h1>
<section class="card"><h2>演讲库</h2><div id="library" class="library"></div><button id="newSpeech" class="btn light small" style="width:100%;margin-top:8px">＋ 新建演讲</button></section>
<section class="card"><h2>演讲稿</h2><input id="title" class="titleInput" type="text" placeholder="演讲标题"><div style="height:8px"></div><textarea id="script" placeholder="把完整演讲稿粘贴到这里……"></textarea><div class="row" style="margin-top:8px"><button id="save" class="btn">保存</button><button id="delete" class="btn light">删除</button></div></section>
<section class="card"><h2>显示模式</h2><div class="mode"><button data-mode="full" class="active">全文显示</button><button data-mode="key">提示词</button></div><div id="promptBox" style="display:none;margin-top:12px"><div class="label">提示词（每行一个屏幕段）</div><textarea id="prompts" style="min-height:150px" placeholder="Small habit • repeat • change"></textarea><div class="row" style="margin-top:8px"><button id="autoPrompt" class="btn light small">自动生成</button><button id="savePrompt" class="btn light small">保存提示词</button></div></div></section>
<section class="card"><h2>提词设置</h2><div class="label">目标时长</div><div class="row"><input id="duration" type="number" min="0.5" max="30" step="0.1" value="3"><span style="flex:0 0 auto;font-size:13px">分钟</span></div><div class="label">自动滚动速度</div><input id="speed" type="range" min="0.65" max="1.5" step="0.05" value="1"><div class="value" id="speedV">1.00×</div><div class="label">字体大小</div><input id="font" type="range" min="22" max="58" value="34"><div class="value" id="fontV">34 px</div><div class="label">文字区域高度</div><input id="area" type="range" min="55" max="100" value="88"><div class="value" id="areaV">88%</div><div class="label">文字区域上边距</div><input id="top" type="range" min="0" max="25" value="6"><div class="value" id="topV">6%</div><label class="switch"><input id="voiceEnable" type="checkbox">语音跟随：按我实际读到的句子移动</label><label class="switch"><input id="mirror" type="checkbox" checked>前置摄像头镜像</label></section>
<section class="card"><button id="start" class="btn" style="width:100%;font-size:17px">进入录像提词</button><div id="error"></div><p class="hint">建议直接用 GitHub Pages 的 HTTPS 地址在 iPhone Safari 打开，不要用本地 HTML 文件。第一次进入会请求摄像头和麦克风权限。</p></section>
</div>

<div id="stage">
<video id="camera" autoplay playsinline muted></video><div id="shade"></div>
<div id="teleText"><div id="track"></div></div><div id="focusLine"></div>
<div id="topBar"><button id="exit" class="ghost">退出</button><button id="voiceIndicator" class="ghost">语音跟随：关</button></div>
<div id="recState">预览中</div><div id="debug"></div>
<div id="bottomBar"><button id="record" class="bottomBtn">● 开始录制</button><button id="pause" class="bottomBtn" style="display:none">暂停</button><button id="auto" class="bottomBtn">自动</button><button id="reset" class="bottomBtn">↺</button><div id="clock" class="clock">00:00</div></div>
</div>

<div id="result"><div class="resultBox"><h2 style="margin:0 0 8px">录像完成</h2><p class="hint">提词文字只在屏幕上显示，默认不会写进录像。</p><div class="resultActions"><button id="share" class="btn">分享 / 保存到相册</button><a id="download" class="btn light" href="#" download>下载视频</a><button id="closeResult" class="btn light" style="grid-column:1/-1">关闭</button></div></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let library=[],activeId=null,mode='full',stream=null,media=null,chunks=[],recording=false,paused=false,manual=false,voiceEnabled=false;
let startAt=0,pausedTotal=0,pauseStarted=0,tick=null,frame=null,currentIndex=0,recognition=null,resultUrl=null;

function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',1800)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}
function saveLib(){localStorage.setItem('speech_teleprompter_v15',JSON.stringify(library))}
function current(){return library.find(x=>x.id===activeId)}
function splitSentences(text){const paras=text.replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(Boolean);const out=[];for(const p of paras){const m=p.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[p];m.forEach(x=>{x=x.trim();if(x)out.push(x)})}return out}
function normalize(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim()}
function tokens(s){return normalize(s).split(' ').filter(Boolean)}
function editSim(a,b){if(a===b)return 1;if(!a||!b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 0;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-dp[m][n]/Math.max(m,n)}

function load(){try{library=JSON.parse(localStorage.getItem('speech_teleprompter_v15')||'[]')}catch(e){library=[]}if(!library.length){const old=localStorage.getItem('speech_script')||'';library=[{id:uid(),title:'我的演讲',script:old,prompts:''}]}activeId=library[0].id;renderLib();loadEditor()}
function renderLib(){$('library').innerHTML=library.length?library.map(x=>`<div class="speech ${x.id===activeId?'active':''}"><div class="speechInfo"><div class="speechTitle">${esc(x.title||'未命名')}</div><div class="speechMeta">${(x.script.match(/\S+/g)||[]).length} words</div></div><button class="openBtn" data-id="${x.id}">打开</button></div>`).join(''):'<div class="hint">还没有演讲稿。</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{activeId=b.dataset.id;renderLib();loadEditor()})}
function loadEditor(){const s=current();if(!s)return;$('title').value=s.title||'';$('script').value=s.script||'';$('prompts').value=s.prompts||'';setMode('full')}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('promptBox').style.display=m==='key'?'block':'none'}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('save').onclick=()=>{let s=current();if(!s){s={id:uid(),title:'我的演讲',script:'',prompts:''};library=[s];activeId=s.id}s.title=$('title').value.trim()||'未命名演讲';s.script=$('script').value;s.prompts=$('prompts').value;saveLib();renderLib();toast('已保存')};
$('newSpeech').onclick=()=>{const s={id:uid(),title:'新演讲',script:'',prompts:''};library.unshift(s);activeId=s.id;saveLib();renderLib();loadEditor()};
$('delete').onclick=()=>{if(library.length<=1){toast('至少保留一篇');return}library=library.filter(x=>x.id!==activeId);activeId=library[0].id;saveLib();renderLib();loadEditor()};
$('autoPrompt').onclick=()=>{$('prompts').value=splitSentences($('script').value).map(s=>(s.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).slice(0,6).join(' • ')).join('\n');toast('已生成，可继续修改')};
$('savePrompt').onclick=()=>{const s=current();if(s){s.prompts=$('prompts').value;saveLib();toast('提示词已保存')}};

function buildTrack(){const s=current();let arr=[];if(mode==='key'){const p=(s.prompts||$('prompts').value).split(/\n+/).map(x=>x.trim()).filter(Boolean);arr=p.length?p:splitSentences(s.script).map(x=>(x.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).slice(0,6).join(' • '))}else arr=splitSentences(s.script);$('track').innerHTML=arr.map((x,i)=>`<div class="line ${i===0?'active':''}" data-i="${i}">${esc(x)}</div>`).join('');currentIndex=0;applySettings();requestAnimationFrame(()=>scrollCurrent(false))}
function applySettings(){$('speedV').textContent=(+$('speed').value).toFixed(2)+'×';$('fontV').textContent=$('font').value+' px';$('areaV').textContent=$('area').value+'%';$('topV').textContent=$('top').value+'%';$('teleText').style.top=$('top').value+'%';$('teleText').style.height=$('area').value+'%';document.querySelectorAll('.line').forEach(x=>x.style.fontSize=(mode==='key'?Math.max(+$('font').value,30):+$('font').value)+'px');$('camera').style.transform=$('mirror').checked?'scaleX(-1)':'none'}
['speed','font','area','top'].forEach(id=>$(id).oninput=applySettings);$('mirror').onchange=applySettings;$('voiceEnable').onchange=e=>{voiceEnabled=e.target.checked;$('voiceIndicator').textContent='语音跟随：'+(voiceEnabled?'开':'关');if(!voiceEnabled)stopVoice();else if(recording)startVoice()}

function scrollCurrent(smooth=true){const el=document.querySelector(`.line[data-i="${currentIndex}"]`);if(el)el.scrollIntoView({behavior:smooth?'smooth':'auto',block:'center'})}
function setCurrent(i,smooth=true){const max=document.querySelectorAll('.line').length-1;if(max<0)return;currentIndex=Math.max(0,Math.min(i,max));document.querySelectorAll('.line').forEach((el,n)=>el.classList.toggle('active',n===currentIndex));scrollCurrent(smooth)}
$('teleText').addEventListener('touchstart',()=>{if(recording){manual=true;toast('手动滚动中，按“自动”恢复')}});$('teleText').addEventListener('wheel',()=>{if(recording)manual=true});$('auto').onclick=()=>{manual=false;toast('自动跟随已恢复');if(recording)startAuto()};$('reset').onclick=()=>{manual=false;setCurrent(0,false);$('teleText').scrollTop=0}

async function cameraOn(){if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){showError('请用 GitHub Pages 的 HTTPS 地址打开。iPhone 上不要直接打开本地 html 文件。');return false}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}});$('camera').srcObject=stream;return true}catch(e){let m='摄像头/麦克风打不开：';if(e.name==='NotAllowedError')m+='请在 Safari 网站设置中允许摄像头和麦克风。';else if(e.name==='NotFoundError')m+='没有找到摄像头或麦克风。';else if(e.name==='NotReadableError')m+='设备可能被其他 App 占用。';else m+='浏览器返回 '+(e.name||'未知错误')+'。';showError(m);return false}}
function showError(m){$('error').textContent=m;$('error').style.display='block';toast('无法进入录像')}
$('start').onclick=async()=>{const s=current();if(!s?.script.trim()){toast('先输入并保存演讲稿');return}$('error').style.display='none';$('stage').style.display='block';buildTrack();const ok=await cameraOn();if(!ok){$('stage').style.display='none';return}$('recState').textContent='预览中 · 全屏提词已就绪'};
$('exit').onclick=()=>{stopRecording();stopVoice();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('stage').style.display='none'};

function elapsed(){if(!recording)return pausedTotal;return pausedTotal+(paused?pauseStarted-startAt:(Date.now()-startAt)) /1000}
function clock(){const s=Math.floor(elapsed()),m=Math.floor(s/60),q=s%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(q).padStart(2,'0')}
function autoLoop(){if(!recording||paused||manual)return;const box=$('teleText');const max=Math.max(0,box.scrollHeight-box.clientHeight);const dur=Math.max(10,(+$('duration').value||3)*60/(+$('speed').value||1));box.scrollTop=max*Math.min(1,elapsed()/dur);frame=requestAnimationFrame(autoLoop)}
function startAuto(){cancelAnimationFrame(frame);frame=requestAnimationFrame(autoLoop)}
function chooseMime(){const list=['video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];for(const x of list)if(window.MediaRecorder?.isTypeSupported?.(x))return x;return ''}
function startRecording(){if(!stream){toast('摄像头还未打开');return}chunks=[];const mime=chooseMime();try{media=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){toast('这个浏览器不支持网页录像');return}media.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};media.onstop=finishRecording;media.start(250);recording=true;paused=false;manual=false;pausedTotal=0;startAt=Date.now();$('record').textContent='■ 停止录制';$('pause').style.display='block';$('recState').innerHTML='<span style="color:#ff453a">●</span> 录制中';tick=setInterval(clock,250);startAuto();if(voiceEnabled)startVoice()}
function stopRecording(){if(media&&media.state!=='inactive')media.stop();recording=false;paused=false;clearInterval(tick);cancelAnimationFrame(frame);$('record').textContent='● 开始录制';$('pause').style.display='none'}
$('record').onclick=()=>recording?stopRecording():startRecording();
$('pause').onclick=()=>{if(!recording||!media)return;if(!paused){paused=true;pauseStarted=Date.now();media.pause();cancelAnimationFrame(frame);$('pause').textContent='继续';$('recState').textContent='已暂停'}else{pausedTotal+=Date.now()-pauseStarted;startAt=Date.now();media.resume();paused=false;$('pause').textContent='暂停';$('recState').innerHTML='<span style="color:#ff453a">●</span> 录制中';startAuto()}};
function finishRecording(){const type=media?.mimeType||'video/webm';const blob=new Blob(chunks,{type});if(resultUrl)URL.revokeObjectURL(resultUrl);resultUrl=URL.createObjectURL(blob);const ext=type.includes('mp4')?'mp4':'webm';$('download').href=resultUrl;$('download').download='speech-recording.'+ext;$('result').style.display='flex'}
$('closeResult').onclick=()=>{$('result').style.display='none'};
$('share').onclick=async()=>{if(!chunks.length){toast('没有录像');return}const type=media?.mimeType||'video/webm';const ext=type.includes('mp4')?'mp4':'webm';const file=new File(chunks,'speech-recording.'+ext,{type});try{if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:'演讲录像',files:[file]});}else toast('当前浏览器不支持直接分享，请点“下载视频”')}catch(e){if(e.name!=='AbortError')toast('分享未完成')}};

// Speech-following: sentence detection + ordered token alignment.
function startVoice(){stopVoice();const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('voiceIndicator').textContent='语音跟随：此浏览器不支持';return}recognition=new R();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;let base='';recognition.onresult=e=>{let all='';for(let i=e.resultIndex;i<e.results.length;i++)all+=' '+e.results[i][0].transcript;followSpeech(all);$('debug').style.display='block';$('debug').textContent='识别：'+all.trim()};recognition.onerror=e=>{$('voiceIndicator').textContent='语音跟随：识别异常';$('debug').style.display='block';$('debug').textContent='语音识别错误：'+(e.error||'unknown')};recognition.onend=()=>{if(recording&&voiceEnabled)try{recognition.start()}catch(_){}};try{recognition.start();$('voiceIndicator').textContent='语音跟随：开'}catch(e){$('voiceIndicator').textContent='语音跟随：启动失败'}}
function stopVoice(){if(recognition)try{recognition.stop()}catch(_){ }recognition=null}
function followSpeech(spoken){const els=[...document.querySelectorAll('.line')];if(!els.length)return;const q=tokens(spoken);if(q.length<2)return;const start=Math.max(0,currentIndex-1),end=Math.min(els.length,currentIndex+7);let best=currentIndex,bestScore=0;for(let i=start;i<end;i++){const t=tokens(els[i].textContent);if(!t.length)continue;let hits=0,ordered=0,last=-1;for(const sw of q.slice(-18)){let bestJ=-1,bestSim=.58;for(let j=Math.max(0,last+1);j<t.length;j++){const sim=editSim(sw,t[j]);if(sim>bestSim){bestSim=sim;bestJ=j}}if(bestJ>=0){hits++;if(bestJ>last)ordered++;last=bestJ}}const overlap=hits/Math.min(10,t.length);const order=ordered/Math.max(1,hits);const startWords=t.slice(0,5).join(' ');const endWords=t.slice(-5).join(' ');let boost=0;const qs=q.slice(-24).join(' ');if(qs.includes(startWords.slice(0,18)))boost+=.7;if(qs.includes(endWords.slice(0,18)))boost+=.7;const score=overlap+order*.45+boost;if(score>bestScore){bestScore=score;best=i}}if(bestScore>=.9&&best!==currentIndex){manual=false;setCurrent(best,true)}}
load();applySettings();
</script>
</body>
</html>
